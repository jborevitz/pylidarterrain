[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pylidarterrain"
version = "0.1.0"
description = "Bare-earth DEMs and terrain derivatives from classified airborne LiDAR"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "laspy>=2.5", "lazrs", "richdem>=0.3"]

[project.optional-dependencies]
test = ["pytest>=7", "pandas>=2.0"]

[tool.setuptools.packages.find]
include = ["pylidarterrain*"]
